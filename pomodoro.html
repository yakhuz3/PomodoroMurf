<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:rgba(55,53,47,.55);--line:rgba(55,53,47,.16);box-sizing:border-box;padding:0}
*{box-sizing:border-box}
html,body{height:100%;min-height:100vh;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Sarabun";display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s}
.wrap{text-align:center;padding:16px;width:100%;max-width:none}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.tab,.btn,.gear{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:8px 16px}
.tab:hover,.btn:hover,.gear:hover{background:rgba(127,127,127,.12)}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.time{font-size:clamp(72px,22vw,128px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin:8px 0}
.status{color:var(--muted);min-height:1.5em;margin-bottom:20px}
.start{font-size:22px;padding:12px 48px;font-weight:600}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.count{color:var(--muted);margin-top:22px;font-size:14px}
.gear{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.ring .time{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:20px;width:min(92vw,420px);font:inherit}
dialog::backdrop{background:rgba(0,0,0,.4)}
h3{margin:0 0 12px}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}
input[type=number]{width:80px;font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:transparent;color:inherit}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button.sel{outline:2px solid var(--fg);outline-offset:2px}
small{color:var(--muted)}
</style>
</head>
<body>
<button class="gear" id="gear" aria-label="Settings">⚙ Settings</button>
<main class="wrap" id="app">
  <div class="tabs">
    <button class="tab on" data-m="focus">Focus</button>
    <button class="tab" data-m="short">Short Break</button>
    <button class="tab" data-m="long">Long Break</button>
  </div>
  <div class="time" id="time">25:00</div>
  <div class="status" id="status">Press Start to begin</div>
  <button class="btn start" id="start">Start</button>
  <div class="row"><button class="btn" id="reset">Reset</button><button class="btn" id="skip">Skip</button></div>
  <div class="count" id="count">Focus sessions completed: 0</div>
  <div class="count" id="cycles" style="margin-top:6px">Pomodoro cycles completed: 0</div>
</main>

<dialog id="dlg">
  <h3>Settings</h3>
  <label>Focus (min)<input type="number" id="s_focus" min="1" max="180"></label>
  <label>Short Break (min)<input type="number" id="s_short" min="1" max="60"></label>
  <label>Long Break (min)<input type="number" id="s_long" min="1" max="120"></label>
  <label>Long Break every (sessions)<input type="number" id="s_every" min="2" max="10"></label>
  <div>Choose the Background Color</div><div class="sw" id="bgs"></div>
  <div>Choose the Font Color</div><div class="sw" id="fgs"></div>
  <div class="row" style="justify-content:space-between">
    <button class="btn" id="test">Test Sound</button>
    <span><button class="btn" id="cancel">Cancel</button> <button class="btn" id="save">Save</button></span>
  </div>
</dialog>

<script>
(function(){
  var BG=["#ffffff","#f7f6f3","#f1f1ef","#f4eeee","#fbece1","#fbf3db","#edf3ec","#e7f3f8","#f6f3f9","#faf1f5","#fdebec","#191919","#252525","#2f3437","#2e2724","#3b2a1d","#372f1c","#1f332a","#1d2f3c","#352a3f","#3d2535","#3f2a2a"];
  var FG=["#37352f","#787774","#9f6b53","#d9730d","#cb912f","#448361","#337ea9","#9065b0","#c14c8a","#d44c47","#ffffff","#e6e6e6","#e0b08f","#ffa344","#ffdc49","#4dab9a","#529cca","#9a6dd7","#e255a1","#ff7369"];
  var D={focus:25,short:5,long:15,every:4,bg:"#ffffff",fg:"#37352f"};
  var cfg=Object.assign({},D);
  try{var s=localStorage.getItem("pomo_cfg");if(s)cfg=Object.assign({},D,JSON.parse(s));}catch(e){}
  var $=function(i){return document.getElementById(i)};
  var mode="focus",left=cfg.focus*60,end=0,tid=null,running=false,done=0,cycles=0,ac=null,alarmTimer=null,tmpBg,tmpFg;
  var NAME={focus:"Focus",short:"Short Break",long:"Long Break"};

  function applyTheme(){var r=document.documentElement.style;r.setProperty("--bg",cfg.bg);r.setProperty("--fg",cfg.fg);
    var h=cfg.fg.replace("#","");var n=parseInt(h,16);r.setProperty("--muted","rgba("+(n>>16)+","+((n>>8)&255)+","+(n&255)+",.6)");
    r.setProperty("--line","rgba("+(n>>16)+","+((n>>8)&255)+","+(n&255)+",.25)");}
  function fmt(t){t=Math.max(0,Math.ceil(t));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
  function render(){$("time").textContent=fmt(left);document.title=fmt(left)+" · "+NAME[mode];
    $("start").textContent=running?"Pause":"Start";
    document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.m===mode)});
    $("count").textContent="Focus sessions completed: "+done;
    $("cycles").textContent="Pomodoro cycles completed: "+cycles;}
  function setMode(m){stopAlarm();clearInterval(tid);running=false;mode=m;left=cfg[m]*60;
    $("app").classList.remove("ring");$("status").textContent="Press Start to begin";render();}
  function tick(){left=(end-Date.now())/1000;if(left<=0){left=0;finish();return}render()}
  function start(){unlock();stopAlarm();$("app").classList.remove("ring");
    if(running){clearInterval(tid);running=false;$("status").textContent="Paused";render();return}
    running=true;end=Date.now()+left*1000;tid=setInterval(tick,250);$("status").textContent="Running: "+NAME[mode];render();}
  function finish(){clearInterval(tid);running=false;
    var was=mode;if(was==="long")cycles++;if(was==="focus"){done++;mode=(done%cfg.every===0)?"long":"short"}else{mode="focus"}
    left=cfg[mode]*60;render();$("app").classList.add("ring");
    $("status").textContent="Time’s up! Press Start when you’re ready for "+NAME[mode];
    startAlarm();
    try{if("Notification"in window&&Notification.permission==="granted")new Notification("Time’s up: "+NAME[was],{body:"Press Start when you’re ready for "+NAME[mode]})}catch(e){}}
  function unlock(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
  function beep(t0,f,d){var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.4,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.05)}
  function chime(){unlock();if(!ac)return;var t=ac.currentTime+.05;for(var i=0;i<3;i++){beep(t+i*.35,880,.3)}beep(t+1.1,1175,.6)}
  function startAlarm(){chime();var n=0;alarmTimer=setInterval(function(){if(++n>=5){stopAlarm();return}chime()},2600)}
  function stopAlarm(){if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}}

  function swatches(el,list,cur,cb){el.innerHTML="";list.forEach(function(c){var b=document.createElement("button");b.style.background=c;b.title=c;
    if(c.toLowerCase()===cur.toLowerCase())b.className="sel";b.onclick=function(){el.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");cb(c)};el.appendChild(b)})}

  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});
  $("start").onclick=start;
  $("reset").onclick=function(){setMode(mode)};
  $("skip").onclick=function(){stopAlarm();if(mode==="focus"){done++;setMode(done%cfg.every===0?"long":"short")}else setMode("focus")};
  $("gear").onclick=function(){["focus","short","long","every"].forEach(function(k){$("s_"+k).value=cfg[k]});
    tmpBg=cfg.bg;tmpFg=cfg.fg;
    swatches($("bgs"),BG,cfg.bg,function(c){tmpBg=c});swatches($("fgs"),FG,cfg.fg,function(c){tmpFg=c});$("dlg").showModal()};
  $("cancel").onclick=function(){$("dlg").close()};
  $("test").onclick=chime;
  $("save").onclick=function(){
    ["focus","short","long","every"].forEach(function(k){var v=parseInt($("s_"+k).value,10);if(v>0)cfg[k]=v});
    cfg.bg=tmpBg;cfg.fg=tmpFg;
    try{localStorage.setItem("pomo_cfg",JSON.stringify(cfg))}catch(e){}
    applyTheme();$("dlg").close();if(!running){left=cfg[mode]*60}render();};
  document.addEventListener("click",function(){try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}},{once:true});
  applyTheme();render();
})();
</script>
</body>
</html>
